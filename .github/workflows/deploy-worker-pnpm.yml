name: deploy-worker-pnpm

# Shared deploy pipeline for the Cloudflare Workers in this account.
# Callers keep their own trigger, their own Cloudflare token, and their own
# node version; this workflow only owns the order of the steps.
#
# This workflow deploys; it does not test. Gate merges with PR CI and branch
# protection, or put a `test` job with `needs:` in the calling workflow.
#
# Contract with callers — this workflow assumes:
#   - a pnpm workspace (pnpm-lock.yaml at the repository root)
#   - mise.toml at the repository root declaring the node version
on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory holding the wrangler configuration.
          `wrangler deploy` runs here.
        type: string
        default: '.'
      assets-package:
        description: >-
          pnpm workspace package (the `name` in its package.json) whose
          `build` script produces the static assets the Worker serves.
          Empty skips the build.
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so `git describe` can stamp a version

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: mise.toml # the calling repository owns its node version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Worker-served assets have to exist before the upload.
      # --fail-if-no-match: a typo'd package name must fail here, not deploy stale assets.
      - if: inputs.assets-package != ''
        run: pnpm --filter "${{ inputs.assets-package }}" --fail-if-no-match run build

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
        working-directory: ${{ inputs.working-directory }}
        env:
          # An account-owned token carries its account, so wrangler resolves it.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
